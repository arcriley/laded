# Directives defining package identity for Cargo
[package]
name = "laded"
version = "1.0.0"
edition = "2021"
authors = ["Emerge Cooperative"]
license = "MIT"
description = "A chunk-based file downloader and XML catalog archiving engine."
repository = "https://github.com/arcriley/laded"
homepage = "https://github.com/your-username/laded"
documentation = "https://docs.rs/laded"
readme = "README.md"
keywords = ["download", "catalog", "gguf", "manifest", "chunk"]
categories = ["command-line-utilities", "asynchronous"]

# Expose the core functionality as a re-usable library crate.
# Design Rationale: Keeping business logic inside `lib.rs`
# enables third-party Rust binaries to import `laded` as a library
[lib]
name = "laded"
path = "src/lib.rs"

# Expose a command-line interface executable named `laded`.
[[bin]]
name = "laded"
path = "src/utility/laded.rs"

[dependencies]
# CLI interface: `clap` provides declarative command-line argument parsing
clap = { version = "4.4", features = ["derive"] }

# XML and Base64 serialization:
# `quick-xml` handles rapid XML parsing with minimal heap allocations.
# `serde` provides automated struct-to-format serializing and deserializing.
# `base64` decodes and encodes byte arrays stored in binary chunk manifests.
quick-xml = { version = "0.31", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"

# Async runtime and networking:
# `tokio` is the premier asynchronous engine for Rust
# `reqwest` is built on Hyper and handles HTTP connection pooling and streaming.
# `sha2` computes SHA-256 digests to verify chunk integrity before writing data
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
sha2 = "0.10"

# Error handling crates:
# `thiserror` derives structured standard library standard error conversions
# `anyhow` simplifies dynamic, context-aware error propagation in CLI
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
httpmock = "0.7"
predicates = "3.0"
tempfile = "3.8"